<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Pipeline branching: generate exits with the envelope into an If on exitValue.changed; true continues to plan, whose own If on changed continues to apply. Any of the three raising instead of exiting leaves by the pipeline's native Failure arrow, which all three share, into a single notify step. One If per gate, no per-activity error If."><title>Pipeline branching: generate exits with the envelope into an If on exitValue.changed; true continues to plan, whose own If on changed continues to apply. Any of the three raising instead of exiting leaves by the pipeline's native Failure arrow, which all three share, into a single notify step. One If per gate, no per-activity error If.</title>
  <defs>
    <marker id="pad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a94a6"/></marker>
    <marker id="pade" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97070"/></marker>
  </defs>
  <style>
    .box{stroke-width:2}
    .t{font-size:14px;font-weight:700}
    .s{font-size:10.5px;fill:#9aa4b2}
    .ln{stroke:#8a94a6;stroke-width:2;fill:none}
    .el{stroke:#d97070;stroke-width:2;fill:none;stroke-dasharray:5 4}
    .lbl{font-size:10.5px;fill:#9aa4b2;font-weight:600}
    .erl{font-size:10.5px;fill:#d97070;font-weight:700}
  </style>
  <rect class="box" x="24" y="50" width="112" height="56" rx="11" fill="#1e2540" stroke="#7c8fd6"/>
  <text class="t" x="80" y="83" text-anchor="middle" fill="#aeb9f0">generate</text>
  <rect class="box" x="306" y="50" width="92" height="56" rx="11" fill="#1e2540" stroke="#7c8fd6"/>
  <text class="t" x="352" y="83" text-anchor="middle" fill="#aeb9f0">plan</text>
  <rect class="box" x="566" y="50" width="112" height="56" rx="11" fill="#16281f" stroke="#2a9d6c"/>
  <text class="t" x="622" y="83" text-anchor="middle" fill="#7fe0a8">apply</text>
  <polygon class="box" points="216,44 276,78 216,112 156,78" fill="#262b36" stroke="#9aa4b2"/>
  <text class="t" x="216" y="83" text-anchor="middle" fill="#d0d6e0" font-size="13">If</text>
  <text class="s" x="216" y="130" text-anchor="middle">exitValue.changed</text>
  <polygon class="box" points="478,44 538,78 478,112 418,78" fill="#262b36" stroke="#9aa4b2"/>
  <text class="t" x="478" y="83" text-anchor="middle" fill="#d0d6e0" font-size="13">If</text>
  <text class="s" x="478" y="130" text-anchor="middle">changed</text>
  <path class="ln" d="M136 78 L156 78" marker-end="url(#pad)"/>
  <text class="lbl" x="146" y="69" text-anchor="middle">exit</text>
  <path class="ln" d="M276 78 L306 78" marker-end="url(#pad)"/>
  <text class="lbl" x="291" y="69" text-anchor="middle">true</text>
  <path class="ln" d="M398 78 L418 78" marker-end="url(#pad)"/>
  <path class="ln" d="M538 78 L566 78" marker-end="url(#pad)"/>
  <text class="lbl" x="552" y="69" text-anchor="middle">true</text>
  <path class="el" d="M80 186 L622 186"/>
  <path class="el" d="M80 106 L80 186"/>
  <text class="erl" x="87" y="132" text-anchor="start">raise</text>
  <path class="el" d="M352 106 L352 186"/>
  <text class="erl" x="359" y="132" text-anchor="start">raise</text>
  <path class="el" d="M622 106 L622 186"/>
  <text class="erl" x="629" y="132" text-anchor="start">raise</text>
  <path class="el" d="M360 186 L360 224" marker-end="url(#pade)"/>
  <text class="erl" x="367" y="212" text-anchor="start">native Failure arrow</text>
  <rect class="box" x="268" y="224" width="184" height="52" rx="11" fill="#3a1f22" stroke="#d97070"/>
  <text class="t" x="360" y="247" text-anchor="middle" fill="#f0a8a8" font-size="13">notify</text>
  <text class="s" x="360" y="264" text-anchor="middle">one branch for all three</text>
</svg>
