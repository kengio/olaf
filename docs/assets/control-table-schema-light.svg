<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 0 930 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Three-layer data model: layer 1 (Configuration Tables, authored by human) is onelake_security_config plus onelake_security_member; generate resolves both into layer 2 (Security Mapping Table) onelake_security_mapping; layer 3 (Audit Log Table) onelake_security_log receives an append-only per-grant row. The three layers are levels of detail: coarse config, a resolved mapping, and the finest per-grant audit trail."><title>Three-layer data model: layer 1 (Configuration Tables, authored by human) is onelake_security_config plus onelake_security_member; generate resolves both into layer 2 (Security Mapping Table) onelake_security_mapping; layer 3 (Audit Log Table) onelake_security_log receives an append-only per-grant row. The three layers are levels of detail: coarse config, a resolved mapping, and the finest per-grant audit trail.</title>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a94a6"/>
    </marker>
  </defs>
  <style>
    .box{stroke-width:2}
    .t{font-size:14px;font-weight:700}
    .s{font-size:10.5px;fill:#5b6472}
    .ln{stroke:#8a94a6;stroke-width:2;fill:none}
    .step{fill:#3a4250;font-size:12px;font-weight:700}
    .sub{fill:#8a94a6;font-size:10.5px}
    .plus{fill:#9aa4b2;font-size:28px;font-weight:700}
    .lyr{font-size:13px;font-weight:700}
    .lyrs{font-size:10px;fill:#9aa4b2}
  </style>

  <!-- layer bands -->
  <rect x="-150" y="0"   width="930" height="150" fill="#f6f7fd"/>
  <rect x="-150" y="150" width="930" height="122" fill="#f3faf7"/>
  <rect x="-150" y="272" width="930" height="128" fill="#fdfaf3"/>
  <line x1="-130" y1="150" x2="596" y2="150" stroke="#e2e5ec" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="-130" y1="272" x2="596" y2="272" stroke="#e9e2d4" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- layer labels (right) -->
  <text class="lyr"  x="608" y="62"  fill="#6a76c0">Configuration Tables</text>
  <text class="lyrs" x="608" y="79">authored by human</text>
  <text class="lyr"  x="608" y="196" fill="#2a9d6c">Security Mapping Table</text>
  <text class="lyrs" x="608" y="213">generated by the framework</text>
  <text class="lyr"  x="608" y="330" fill="#c17d2a">Audit Log Table</text>
  <text class="lyrs" x="608" y="347">written by the framework</text>

  <!-- level-of-detail labels (left) -->
  <text class="lyr"  x="-135" y="62"  fill="#6a76c0">Level 1</text>
  <text class="lyrs" x="-135" y="79">easy to config</text>
  <text class="lyr"  x="-135" y="196" fill="#2a9d6c">Level 2</text>
  <text class="lyrs" x="-135" y="213">easy to validate</text>
  <text class="lyr"  x="-135" y="330" fill="#c17d2a">Level 3</text>
  <text class="lyrs" x="-135" y="347">easy to audit</text>

  <!-- Layer 1: config + member (equal width, mirrored about x=310) -->
  <rect class="box" x="40" y="34" width="235" height="68" rx="11" fill="#eef1fc" stroke="#7c8fd6"/>
  <text class="t" x="157" y="64" text-anchor="middle" fill="#3a4a8c">onelake_security_config</text>
  <text class="s" x="157" y="85" text-anchor="middle">human-authored · your logic</text>

  <text class="plus" x="310" y="76" text-anchor="middle">+</text>

  <rect class="box" x="345" y="34" width="235" height="68" rx="11" fill="#f0ebfc" stroke="#8e44ad"/>
  <text class="t" x="462" y="64" text-anchor="middle" fill="#6a3a9c">onelake_security_member</text>
  <text class="s" x="462" y="85" text-anchor="middle">preloaded · name → objectId</text>

  <!-- generate → mapping: mirror-symmetric side entries; center stays clear -->
  <path class="ln" d="M157 102 L157 188 Q157 195 164 195 L203 195" marker-end="url(#a3)"/>
  <path class="ln" d="M462 102 L462 188 Q462 195 455 195 L417 195" marker-end="url(#a3)"/>
  <text class="step" x="310" y="130" text-anchor="middle">generate</text>
  <text class="sub"  x="310" y="145" text-anchor="middle">config + member → mapping</text>

  <!-- Layer 2: mapping (centered on x=310) -->
  <rect class="box" x="205" y="170" width="210" height="64" rx="11" fill="#d9f2ea" stroke="#3fae8e"/>
  <text class="t" x="310" y="198" text-anchor="middle" fill="#237a5c">onelake_security_mapping</text>
  <text class="s" x="310" y="218" text-anchor="middle">machine lock-file · provenance</text>

  <!-- generate → log (straight vertical, far left; balances the layer labels on the right) -->
  <path class="ln" d="M120 102 L120 298" marker-end="url(#a3)"/>
  <text class="sub" x="108" y="210" text-anchor="end">generate → log</text>

  <!-- plan · apply → log (straight vertical from mapping center) -->
  <path class="ln" d="M310 234 L310 298" marker-end="url(#a3)"/>
  <text class="sub" x="326" y="284" text-anchor="start">plan · apply → log</text>

  <!-- Layer 3: log (emphasised; centered on x=310, spans config-left → member-right) -->
  <rect class="box" x="40" y="300" width="540" height="72" rx="11" fill="#fcecd0" stroke="#d97706" stroke-width="2.5"/>
  <text class="t" x="310" y="326" text-anchor="middle" fill="#9a5b08">onelake_security_log</text>
  <text class="s" x="310" y="347" text-anchor="middle">append-only · one row per grant (role × scope × member × action)</text>
  <text class="s" x="310" y="363" text-anchor="middle">config_hash + mapping_hash provenance — the full audit trail</text>
</svg>
