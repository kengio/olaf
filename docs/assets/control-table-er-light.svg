<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 620" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Entity-relationship diagram of the four control tables with every column. onelake_security_config (PK role_name) and onelake_security_member (PK member_type + member_name) both feed generate, which builds onelake_security_mapping (PK role_name + scope_path; FK member_*_ids to member, FK config_hash). Both config (generate) and mapping (plan/apply) write onelake_security_log (FK config_hash, mapping_hash, member_id). All relationships are one-to-many: config-to-mapping, config-to-log, mapping-to-log, and member-to-mapping (one member row is referenced by many mapping rows)."><title>Entity-relationship diagram of the four control tables with every column. onelake_security_config (PK role_name) and onelake_security_member (PK member_type + member_name) both feed generate, which builds onelake_security_mapping (PK role_name + scope_path; FK member_*_ids to member, FK config_hash). Both config (generate) and mapping (plan/apply) write onelake_security_log (FK config_hash, mapping_hash, member_id). All relationships are one-to-many: config-to-mapping, config-to-log, mapping-to-log, and member-to-mapping (one member row is referenced by many mapping rows).</title>
