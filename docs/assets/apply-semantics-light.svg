<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 410" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="What apply does to the live role set. Config declares two roles, Sales and Finance, while the live item also holds DefaultReader and a hand-made LegacyRole that config does not declare. A bare apply is the default and replaces the whole set: the two declared roles remain and both undeclared roles, including DefaultReader, are deleted. Passing keep_unmanaged equals true upserts instead: the two declared roles are created or updated and both undeclared roles stay. Fabric does not recreate a deleted DefaultReader, so a default apply against a lakehouse people already read from is an access cutover, not a deploy."><title>What apply does to the live role set. Config declares two roles, Sales and Finance, while the live item also holds DefaultReader and a hand-made LegacyRole that config does not declare. A bare apply is the default and replaces the whole set: the two declared roles remain and both undeclared roles, including DefaultReader, are deleted. Passing keep_unmanaged equals true upserts instead: the two declared roles are created or updated and both undeclared roles stay. Fabric does not recreate a deleted DefaultReader, so a default apply against a lakehouse people already read from is an access cutover, not a deploy.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a94a6"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97070"/></marker>
  </defs>
  <style>
    .box{stroke-width:2}
    .t{font-size:14px;font-weight:700}
    .s{font-size:10.5px;fill:#5b6472}
    .ln{stroke:#8a94a6;stroke-width:2;fill:none}
    .lbl{font-size:10.5px;fill:#5b6472;font-weight:600}
    .chip{font-size:11px;font-weight:600}
    .del{font-size:11px;font-weight:700;fill:#9c3535}
    .kept{font-size:11px;font-weight:700;fill:#237a5c}
    .note{font-size:10.5px;fill:#5b6472;font-style:italic}
  </style>
  <rect class="box" x="24" y="20" width="320" height="76" rx="11" fill="#eef1fc" stroke="#7c8fd6"/>
  <text class="t" x="184" y="44" text-anchor="middle" fill="#3a4a8c" font-size="13">config declares</text>
  <text class="chip" x="184" y="65" text-anchor="middle" fill="#3a4a8c">Sales · Finance</text>
  <text class="s" x="184" y="84" text-anchor="middle">the complete intent</text>
  <rect class="box" x="404" y="20" width="320" height="76" rx="11" fill="#eeeef2" stroke="#9aa4b2"/>
  <text class="t" x="564" y="44" text-anchor="middle" fill="#4a5262" font-size="13">live roles on the item</text>
  <text class="chip" x="564" y="65" text-anchor="middle" fill="#4a5262">Sales · Finance · DefaultReader · LegacyRole</text>
  <text class="s" x="564" y="84" text-anchor="middle">two of these config never declared</text>
  <path class="ln" d="M184 96 L184 126 L564 126 L564 96"/>
  <path class="ln" d="M184 126 L184 176" marker-end="url(#a)"/>
  <path class="ln" d="M564 126 L564 176" marker-end="url(#a)"/>
  <text class="s" x="374" y="120" text-anchor="middle">apply reads both, every run</text>
  <text class="lbl" x="192" y="150" text-anchor="start">apply()</text>
  <text class="s" x="192" y="165" text-anchor="start">the default</text>
  <text class="lbl" x="572" y="150" text-anchor="start">apply(keep_unmanaged=true)</text>
  <text class="s" x="572" y="165" text-anchor="start">the deliberate override</text>
  <rect class="box" x="24" y="178" width="320" height="128" rx="11" fill="#fdeaea" stroke="#d97070"/>
  <text class="t" x="184" y="202" text-anchor="middle" fill="#9c3535" font-size="13">REPLACE</text>
  <text class="kept" x="184" y="226" text-anchor="middle">kept: Sales · Finance</text>
  <text class="del" x="184" y="250" text-anchor="middle">deleted: LegacyRole</text>
  <text class="del" x="184" y="268" text-anchor="middle">deleted: DefaultReader</text>
  <text class="s" x="184" y="292" text-anchor="middle">live now mirrors config exactly</text>
  <rect class="box" x="404" y="178" width="320" height="128" rx="11" fill="#e6f7ee" stroke="#2a9d6c"/>
  <text class="t" x="564" y="202" text-anchor="middle" fill="#237a5c" font-size="13">INCREMENTAL UPSERT</text>
  <text class="kept" x="564" y="226" text-anchor="middle">created / updated: Sales · Finance</text>
  <text class="kept" x="564" y="254" text-anchor="middle">untouched: DefaultReader · LegacyRole</text>
  <text class="s" x="564" y="284" text-anchor="middle">nothing is ever deleted</text>
  <rect class="box" x="24" y="322" width="700" height="66" rx="11" fill="#fcefd6" stroke="#d99a45"/>
  <text class="t" x="374" y="346" text-anchor="middle" fill="#9c6a2a" font-size="13">Fabric does not recreate a deleted DefaultReader</text>
  <text class="s" x="374" y="368" text-anchor="middle">so a default apply on a lakehouse people already read from is an access cutover, not a deploy</text>
</svg>
